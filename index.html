<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expedição · viagens de moto</title>
<meta name="description" content="Companheiro de viagem para expedições de moto: roteiro por dias, abastecimento pela autonomia, tempo no caminho, gastos divididos e roadbook.">
<meta name="theme-color" content="#0b6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!-- Pré-visualização do link (WhatsApp, Instagram, Facebook, X) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Expedição">
<meta property="og:title" content="Expedição · viagens de moto">
<meta property="og:description" content="Planeje a expedição por dias, saiba onde abastecer pela autonomia da moto, veja o tempo no caminho e convide quem vai junto.">
<meta property="og:url" content="https://jacobbv.github.io/expedicao-app/">
<meta property="og:image" content="https://jacobbv.github.io/expedicao-app/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Placa verde de rodovia com uma seta para cima e o nome Expedição">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expedição">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@500;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
// Aplica estilo, tema e menu salvos antes de desenhar (evita piscar)
try {
  var d = document.documentElement, s = localStorage.getItem("estilo"), t = localStorage.getItem("tema") || "auto";
  if (s === "asfalto" || s === "trilha" || s === "placa") d.dataset.estilo = s;
  d.dataset.tema = t === "escuro" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches) ? "escuro" : "claro";
  if (localStorage.getItem("menu") === "mini") d.dataset.menu = "mini";
} catch (e) {}
</script>
</head>
<body>
<div id="app">
  <aside class="side" id="side" hidden aria-label="Menu lateral"></aside>
  <header class="top"><div class="wrap">
    <a class="brand" href="#viagens" aria-label="Início"><span class="mark" aria-hidden="true"></span><span class="b1">Expedição</span><span class="b2" id="brandTrip"></span></a>
    <button class="pill" id="syncPill" type="button" hidden><span class="dot"></span><span class="t"></span></button>
    <button class="bell" id="bellBtn" type="button" aria-label="Novidades" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
    <button class="avatar" id="avatarBtn" type="button" aria-label="Sua conta e preferências" hidden></button>
  </div></header>
  <main><div class="wrap" id="view"><p class="muted center pad">Carregando…</p></div></main>
  <nav class="nav" id="nav" hidden aria-label="Seções da viagem"></nav>
</div>
<div id="layer"></div>
<script src="js/version.js"></script>
<script type="module" src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
